name: Build a private Node.js service image

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read image name and application version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build the application
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$APP_VERSION" \
            -t "$IMAGE:$GITHUB_SHA" .
      - name: Publish the tested commit and application version
        if: inputs.publish && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=$(gh api "repos/$GITHUB_REPOSITORY")
          jq -e '.private and .owner.type == "User"' <<< "$repo" >/dev/null
          package_url="users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
          test "$(gh api "$package_url" --jq .visibility)" = private
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          tags=$(skopeo list-tags "docker://$IMAGE" | jq -r '.Tags[]')
          stable=$(printf '%s\n' "$tags" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [[ -n "$stable" ]] && dpkg --compare-versions "$APP_VERSION" lt "$stable"; then
            echo "Commit image published. A newer application version is already available."
            exit 0
          fi
          if grep -Fxq "$APP_VERSION" <<< "$tags"; then
            previous=$(skopeo inspect "docker://$IMAGE:$APP_VERSION")
            if [[ "$(jq -r '.Labels["org.opencontainers.image.revision"] // ""' <<< "$previous")" != "$GITHUB_SHA" ]]; then
              echo "Commit image published. This application version already has its original release."
              exit 0
            fi
          else
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$APP_VERSION"
            docker push "$IMAGE:$APP_VERSION"
          fi
          skopeo copy --all --preserve-digests "docker://$IMAGE:$APP_VERSION" "docker://$IMAGE:latest"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:$APP_VERSION")" = "$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")"
